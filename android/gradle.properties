# Workaround for "Could not close incremental caches … Storage is already
# registered": Flutter's composite build compiles each plugin module twice per
# daemon session, and the second pass collides in Kotlin's incremental-storage
# registry (mirrors JetBrains KT-84306, still open; resolved KT-87217 is
# JS/Wasm-only). Empirically NOT fixed by any toolchain bump — tested Kotlin
# 2.4.10 (2026-08-02) and the full Flutter-master combo AGP 9.1.0 + Gradle
# 9.3.1 + Kotlin 2.4.0 (2026-08-02). Keep until a Flutter plugin-build fix
# lands. Disabling incremental compilation sidesteps the corruption entirely.
kotlin.incremental=false
